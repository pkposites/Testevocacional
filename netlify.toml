[build]
  command = "npm run build && npm run check:bundle"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/db/schema.sql"]
  # PGlite só é usado em dev/testes locais.
  external_node_modules = ["@electric-sql/pglite"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Service worker do painel: sempre buscar a versão nova.
[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
